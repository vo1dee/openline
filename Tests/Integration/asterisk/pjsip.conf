; Test PBX only. Passwords here are throwaway fixtures.
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
; Clients reach the container through Docker's port mapping on loopback.
local_net = 127.0.0.1/32
external_media_address = 127.0.0.1
external_signaling_address = 127.0.0.1

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060
local_net = 127.0.0.1/32
external_media_address = 127.0.0.1
external_signaling_address = 127.0.0.1

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
local_net = 127.0.0.1/32
external_media_address = 127.0.0.1
external_signaling_address = 127.0.0.1
cert_file = /etc/asterisk/keys/tls.crt
priv_key_file = /etc/asterisk/keys/tls.key

[endpoint-template](!)
type = endpoint
context = openline-test
disallow = all
allow = ulaw,alaw,g722,opus
direct_media = no
; The container's own address is unreachable from the host.
media_address = 127.0.0.1
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
media_encryption_optimistic = yes
allow_transfer = yes

[aor-template](!)
type = aor
max_contacts = 1
remove_existing = yes

[auth-template](!)
type = auth
auth_type = userpass

[1001](endpoint-template)
auth = 1001
aors = 1001
[1001](aor-template)
[1001](auth-template)
username = 1001
password = test-1001

[1002](endpoint-template)
auth = 1002
aors = 1002
[1002](aor-template)
[1002](auth-template)
username = 1002
password = test-1002

[1003](endpoint-template)
auth = 1003
aors = 1003
[1003](aor-template)
[1003](auth-template)
username = 1003
password = test-1003

; Mandatory SDES-SRTP.
[1004](endpoint-template)
auth = 1004
aors = 1004
media_encryption = sdes
media_encryption_optimistic = no
[1004](aor-template)
[1004](auth-template)
username = 1004
password = test-1004

; DTMF through SIP INFO.
[1005](endpoint-template)
auth = 1005
aors = 1005
dtmf_mode = info
[1005](aor-template)
[1005](auth-template)
username = 1005
password = test-1005

; Digits-only secret for XCUITest, whose key synthesis can drop letters.
[1006](endpoint-template)
auth = 1006
aors = 1006
[1006](aor-template)
[1006](auth-template)
username = 1006
password = 1006-1006
