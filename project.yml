name: Openline
options:
  bundleIdPrefix: org.openline
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Openline:
    path: .
targets:
  Openline:
    type: application
    platform: macOS
    sources:
      - path: App/Openline
    entitlements:
      path: App/Openline/Openline.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.device.audio-input: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openline.softphone
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Openline
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Openline uses your microphone to carry your voice during calls. It never records or stores audio.
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © 2026 Openline contributors. GPL-3.0-or-later.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: Openline
        product: OpenlineCore
      - package: Openline
        product: OpenlineStore
      - package: Openline
        product: OpenlineSIP
      - package: Openline
        product: OpenlineKit
  OpenlineUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/OpenlineUITests
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Openline
schemes:
  Openline:
    build:
      targets:
        Openline: all
    test:
      targets:
        - OpenlineUITests
