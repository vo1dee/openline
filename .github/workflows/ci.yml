name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    # macos-latest is still macOS 26; this image has macOS 27 and Xcode 27.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Vendor
          key: native-${{ hashFiles('scripts/build-native-deps.sh', 'scripts/config_site.h') }}
      - run: brew install xcodegen
      - run: ./scripts/build-native-deps.sh
      - run: swift test
      - run: xcodegen generate
      - run: xcodebuild -project Openline.xcodeproj -scheme Openline -destination 'platform=macOS,arch=arm64' analyze CODE_SIGN_IDENTITY=-
